<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b1d">
<title>贺卡生成器 · Card Maker</title>
<meta name="description" content="选一个节日，写下名字和祝福，生成一张会动的贺卡链接，发到 WhatsApp、微信、Instagram。">
<meta property="og:type" content="website">
<meta property="og:title" content="✦ Make a little animated card">
<meta property="og:description" content="Christmas, New Year, Lunar New Year, Birthday, Valentine’s Day, Thanksgiving">
<meta property="og:image" content="https://katherinecheung.github.io/KatherineZhang.github.io/cards/christmas/og.jpg">
<style>
  :root{
    --gold:#f3c97a; --gold-soft:#ffe3a6; --cream:#fbf3e4; --muted:rgba(251,243,228,.62);
    --night:#070b1d; --panel:rgba(255,246,230,.06); --line:rgba(243,201,122,.28);
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Songti SC','STSong','Noto Serif SC',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh;min-height:100dvh;color:var(--cream);font-family:var(--sans);
    background-color:var(--night);
    background-image:
      radial-gradient(1000px 560px at 50% 115%, rgba(255,166,84,.20), transparent 62%),
      radial-gradient(700px 480px at 85% -8%, rgba(110,132,255,.14), transparent 62%),
      linear-gradient(180deg,#050816 0%,#0a1330 50%,#171531 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  main{max-width:560px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom))}
  .layout{display:grid;grid-template-columns:minmax(0,1fr);gap:0 20px}

  /* live preview: the real card page in a phone-sized frame, scaled to fit */
  .pv-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .pv-head button{appearance:none;background:none;border:0;color:var(--muted);font:inherit;font-size:.78rem;cursor:pointer;text-decoration:underline}
  .phone{
    position:relative;width:100%;max-width:300px;margin:0 auto;aspect-ratio:360/700;
    border-radius:26px;overflow:hidden;background:#05070f;
    border:1px solid var(--line);box-shadow:0 0 0 6px rgba(5,8,22,.7),0 24px 60px -18px rgba(0,0,0,.8);
  }
  .phone iframe{position:absolute;left:0;top:0;width:360px;height:700px;border:0;transform-origin:0 0;transform:scale(var(--k,1))}
  .phone.collapsed{display:none}
  .pv-panel .note{text-align:center}
  @media (min-width:960px){
    main{max-width:1040px}
    .layout{grid-template-columns:minmax(0,1fr) 360px;align-items:start}
    .layout > .panel{grid-column:1}
    .layout > .pv-panel{grid-column:2;grid-row:1 / span 4;position:sticky;top:20px}
    .phone.collapsed{display:block}
    .pv-head button{display:none}
  }
  header{text-align:center;margin-bottom:22px}
  header .star{color:var(--gold);font-size:1.1rem;text-shadow:0 0 12px rgba(255,200,120,.8)}
  h1{margin:.2em 0 .15em;font-family:var(--serif);font-weight:500;font-size:clamp(1.6rem,6vw,2.1rem);color:var(--gold-soft);letter-spacing:.04em}
  header p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.6}

  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:16px;
    box-shadow:0 20px 50px -16px rgba(0,0,0,.55);
  }
  label,.label{display:block;font-size:.82rem;letter-spacing:.08em;color:var(--gold);margin:0 0 7px}
  .field{margin-bottom:16px}
  .field:last-child{margin-bottom:0}
  .hint{font-size:.78rem;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:10px}
  input[type=text],textarea{
    width:100%;font:inherit;font-size:16px;color:var(--cream);
    background:rgba(5,8,22,.55);border:1px solid rgba(243,201,122,.22);border-radius:12px;
    padding:11px 13px;outline:none;transition:border-color .2s, box-shadow .2s;
  }
  textarea{min-height:120px;resize:vertical;line-height:1.6}
  input[type=text]:focus,textarea:focus{border-color:rgba(243,201,122,.65);box-shadow:0 0 0 3px rgba(243,201,122,.12)}
  ::placeholder{color:rgba(251,243,228,.35)}

  .themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .theme{
    appearance:none;font:inherit;cursor:pointer;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:11px 4px 9px;border-radius:12px;
    color:var(--muted);background:rgba(5,8,22,.45);border:1px solid rgba(243,201,122,.16);
    transition:border-color .2s, background .2s, color .2s;
  }
  .theme .em{font-size:1.5rem;line-height:1}
  .theme .nm{font-size:.8rem;letter-spacing:.04em}
  .theme:hover{border-color:rgba(243,201,122,.45)}
  .theme[aria-pressed=true]{color:var(--gold-soft);border-color:var(--gold);background:rgba(243,201,122,.12)}

  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:rgba(5,8,22,.45)}
  .seg button{
    appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:.88rem;
    padding:7px 16px;border-radius:999px;cursor:pointer;
  }
  .seg button[aria-pressed=true]{background:rgba(243,201,122,.18);color:var(--gold-soft)}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
  .chip{
    appearance:none;font:inherit;font-size:.78rem;cursor:pointer;
    color:var(--muted);background:rgba(255,220,160,.04);
    border:1px solid rgba(243,201,122,.2);border-radius:999px;padding:6px 11px;
  }
  .chip:hover{color:var(--gold-soft);border-color:rgba(243,201,122,.5)}
  .chip[aria-pressed=true]{color:var(--gold-soft);border-color:var(--gold);background:rgba(243,201,122,.12)}

  .btn{
    appearance:none;font:inherit;font-size:.95rem;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 16px;border-radius:12px;border:1px solid var(--line);
    color:var(--gold-soft);background:rgba(255,220,160,.06);text-decoration:none;
    transition:background .2s,border-color .2s;
  }
  .btn:hover{background:rgba(255,220,160,.12);border-color:rgba(243,201,122,.55)}
  .btn.primary{
    width:100%;font-weight:600;letter-spacing:.06em;color:#2a1a06;border:0;
    background:linear-gradient(180deg,#ffe3a6,#f0b85e);box-shadow:0 10px 26px -8px rgba(255,180,80,.55);
  }
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.wa{color:#d9ffe6;border-color:rgba(80,220,130,.4);background:rgba(37,211,102,.12)}
  .btn.wa:hover{background:rgba(37,211,102,.2)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .row .btn{width:100%}
  .btn.wide{width:100%;margin-top:10px}

  #result[hidden]{display:none}
  .link{
    font-size:.8rem;line-height:1.5;color:var(--muted);word-break:break-all;
    background:rgba(5,8,22,.55);border:1px dashed rgba(243,201,122,.25);border-radius:10px;padding:10px 12px;
    max-height:5.2em;overflow:auto;
  }
  .note{font-size:.78rem;color:var(--muted);line-height:1.6;margin:12px 0 0}

  .sent-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .sent-head button{appearance:none;background:none;border:0;color:var(--muted);font:inherit;font-size:.78rem;cursor:pointer;text-decoration:underline}
  ul.sent{list-style:none;margin:0;padding:0}
  ul.sent li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(243,201,122,.12)}
  ul.sent li:first-child{border-top:0}
  ul.sent .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.92rem}
  ul.sent .who small{color:var(--muted);margin-left:6px}
  ul.sent .btn{padding:6px 11px;font-size:.78rem;border-radius:9px}
  .empty{color:var(--muted);font-size:.85rem;margin:0}

  /* batch mode */
  textarea.list{min-height:150px;font-size:15px;line-height:1.7}
  ul.batch .who{white-space:normal}
  ul.batch .who small{display:block;margin:2px 0 0}
  ul.batch li.is-done .who{opacity:.5}
  .done-btn{
    appearance:none;flex:none;width:28px;height:28px;padding:0;border-radius:50%;cursor:pointer;
    font:inherit;font-size:.85rem;color:var(--muted);background:none;border:1px solid var(--line);
  }
  .done-btn[aria-pressed=true]{background:rgba(37,211,102,.22);border-color:rgba(80,220,130,.6);color:#d9ffe6}

  .toast{
    position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,20px);
    background:rgba(20,22,46,.92);border:1px solid var(--line);color:var(--gold-soft);
    padding:10px 18px;border-radius:999px;font-size:.88rem;opacity:0;pointer-events:none;
    transition:opacity .3s, transform .3s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main>
  <header>
    <div class="star">✦</div>
    <h1 data-i18n="h1"></h1>
    <p data-i18n="sub"></p>
  </header>

  <div class="layout">
  <section class="panel">
    <div class="field">
      <div class="seg" role="group" id="modeSeg" aria-label="Mode">
        <button type="button" data-mode="single" aria-pressed="true" data-i18n="modeSingle"></button>
        <button type="button" data-mode="batch" aria-pressed="false" data-i18n="modeBatch"></button>
      </div>
    </div>
    <div class="field">
      <span class="label" data-i18n="themeLabel"></span>
      <div class="themes" id="themes" role="group"></div>
    </div>
    <div class="field">
      <span class="label" data-i18n="langLabel"></span>
      <div class="seg" role="group" id="langSeg" aria-label="Language">
        <button type="button" data-lang="zh" aria-pressed="true">中文</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
    </div>
    <div class="field" id="toField">
      <label for="to" data-i18n="toLabel"></label>
      <input id="to" type="text" maxlength="24" autocomplete="off" placeholder="妈妈 / Ran / Grandpa">
    </div>
    <div class="field" id="listField" hidden>
      <label for="list" data-i18n="listLabel"></label>
      <textarea id="list" class="list" spellcheck="false"></textarea>
      <div class="hint"><span data-i18n="listHint"></span><span id="listCount"></span></div>
    </div>
    <div class="field">
      <label for="msg" id="msgLabel"></label>
      <textarea id="msg" maxlength="300"></textarea>
      <div class="hint"><span data-i18n="msgHint"></span><span id="count">0/300</span></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="field">
      <label for="from" data-i18n="fromLabel"></label>
      <input id="from" type="text" maxlength="24" autocomplete="off" placeholder="KZ">
    </div>
    <button id="make" class="btn primary" type="button" data-i18n="make"></button>
  </section>

  <section class="panel pv-panel">
    <div class="pv-head">
      <span class="label" style="margin:0" data-i18n="pvLabel"></span>
      <button type="button" id="pvToggle"></button>
    </div>
    <div class="phone" id="phone"><iframe id="pv" title="Card preview"></iframe></div>
    <p class="note" data-i18n="pvNote"></p>
  </section>

  <section class="panel" id="result" hidden>
    <span class="label" data-i18n="ready"></span>
    <div class="link" id="link"></div>
    <div class="row">
      <a class="btn" id="preview" target="_blank" rel="noopener" data-i18n="preview"></a>
      <button class="btn" id="copy" type="button" data-i18n="copy"></button>
      <a class="btn wa" id="wa" target="_blank" rel="noopener" data-i18n="wa"></a>
      <button class="btn" id="share" type="button" data-i18n="share"></button>
    </div>
    <a class="btn wide" id="rec" target="_blank" rel="noopener" data-i18n="rec"></a>
    <p class="note" data-i18n="note"></p>
  </section>

  <section class="panel" id="batch" hidden>
    <div class="sent-head">
      <span class="label" style="margin:0" id="batchTitle"></span>
      <button type="button" id="batchClear" data-i18n="clear"></button>
    </div>
    <ul class="sent batch" id="batchList"></ul>
    <div class="row">
      <button class="btn" id="copyAll" type="button" data-i18n="copyAll"></button>
      <button class="btn" id="csv" type="button" data-i18n="csv"></button>
    </div>
    <p class="note" data-i18n="batchNote"></p>
  </section>

  <section class="panel">
    <div class="sent-head">
      <span class="label" style="margin:0" data-i18n="made"></span>
      <button type="button" id="clear" data-i18n="clear"></button>
    </div>
    <ul class="sent" id="sent"></ul>
    <p class="empty" id="empty" data-i18n="empty"></p>
  </section>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="themes/christmas.js"></script>
<script src="themes/newyear.js"></script>
<script src="themes/cny.js"></script>
<script src="themes/birthday.js"></script>
<script src="themes/valentine.js"></script>
<script src="themes/thanksgiving.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const THEMES = window.CardThemes;
const ORDER = ['christmas', 'newyear', 'cny', 'birthday', 'valentine', 'thanksgiving'].filter(id => THEMES[id]);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

const UI = {
  zh: {
    h1: th => `做一张${th.cardName.zh}`,
    sub: '选好节日，写下名字和祝福，生成专属链接，<br>发给 WhatsApp、微信、Instagram 上的 TA。',
    themeLabel: '选择节日', langLabel: '贺卡语言', toLabel: '送给谁', msgLabel: '祝福语', fromLabel: '署名',
    msgHint: '可以直接在上面改；可以换行', make: '✦ 生成贺卡链接', ready: '贺卡已就绪',
    preview: '👀 预览', copy: '🔗 复制链接', wa: '💬 WhatsApp', share: '📤 更多分享', rec: '🎬 录屏版（做视频用）',
    note: '微信：复制链接后粘贴到聊天里。Instagram：在私信里粘贴链接。<br>想发视频：打开「录屏版」，用手机录屏（记得关掉静音模式）。想发图片：贺卡打开后点「保存图片」。<br>祝福语就写在链接里，拿到链接的人都能看到。',
    made: '已生成的贺卡', clear: '清空', empty: '还没有。生成的链接会保存在这台设备上，方便一个个发出去。',
    copied: '链接已复制 ✦', copyFail: '复制失败，请长按上面的链接手动复制', noShare: '这个浏览器不支持系统分享，请复制链接',
    anyone: '（未写名字）', defChip: '默认', msgPh: '写下你想说的话…',
    pvLabel: '实时预览', pvHide: '收起', pvShow: '展开',
    pvNote: '这里跳过了拆信封，也不放音乐。<br>可以在里面点一点、滑一滑，试试互动效果。',
    modeSingle: '单张', modeBatch: '批量',
    listLabel: '名单（一行一位）', listHint: '每行：名字 | 手机号（可选）| 专属祝福（可选）', listCount: n => `${n} 位`,
    listPh: '妈妈 | 85291234567\n爸爸 | 85298765432 | 爸，圣诞快乐！今年辛苦啦\nRan\nGrandma, +1 415 555 0100',
    msgLabelBatch: '统一祝福语（没写专属祝福的人用这条）', makeBatch: n => `✦ 批量生成 ${n} 张贺卡`,
    batchTitle: (th, n, d) => `${th.emoji} 已生成 ${n} 张 · 已发送 ${d}`, batchEmpty: '名单是空的，至少写一个名字',
    copyAll: '📋 复制全部', csv: '⬇️ 导出表格', customTag: '专属祝福', noPhone: '未填手机号', markSent: '标记为已发送',
    allCopied: '已复制全部祝福 ✦', csvHead: ['名字', '手机号', '链接', '发送内容'],
    batchNote: '点 💬 会打开 WhatsApp：填了手机号就直接进入和 TA 的聊天，消息已经写好，点发送就行，并自动标记成已发送。<br>微信 / Instagram：点 🔗 复制单个链接，或「复制全部」后逐个粘贴。<br>手机号要带国家或地区区号（如 852、86、1），否则 WhatsApp 找不到人。',
    shareText: (th, to, url) => `${th.emoji} ${to ? to + '，' : ''}给你准备了一张${th.cardName.zh}，点开看看 ✨\n${url}`
  },
  en: {
    h1: th => `Make a ${th.cardName.en}`,
    sub: 'Pick an occasion, add a name and a few words, get a personal link,<br>and send it on WhatsApp, WeChat or Instagram.',
    themeLabel: 'Occasion', langLabel: 'Card language', toLabel: 'To', msgLabel: 'Message', fromLabel: 'From',
    msgHint: 'Edit it right here; line breaks are kept', make: '✦ Create card link', ready: 'Your card is ready',
    preview: '👀 Preview', copy: '🔗 Copy link', wa: '💬 WhatsApp', share: '📤 Share…', rec: '🎬 Recording version (for video)',
    note: 'WeChat: copy the link and paste it in the chat. Instagram: paste the link in a DM.<br>For a video: open the recording version and screen-record it (turn silent mode off). For a picture: open the card and tap “Save image”.<br>The message lives in the link, so anyone with the link can read it.',
    made: 'Cards you made', clear: 'Clear', empty: 'None yet. Links you make are kept on this device so you can send them one by one.',
    copied: 'Link copied ✦', copyFail: 'Copy failed — long-press the link above to copy it', noShare: 'Sharing isn’t supported here — copy the link instead',
    anyone: '(no name)', defChip: 'Default', msgPh: 'Write your message…',
    pvLabel: 'Live preview', pvHide: 'Hide', pvShow: 'Show',
    pvNote: 'The envelope and music are skipped here.<br>Tap or swipe inside to try the effects.',
    modeSingle: 'One card', modeBatch: 'Batch',
    listLabel: 'Recipients (one per line)', listHint: 'Each line: name | phone (optional) | own message (optional)', listCount: n => `${n} people`,
    listPh: 'Mom | 85291234567\nDad | 85298765432 | Merry Christmas, Dad! Thanks for everything\nRan\nGrandma, +1 415 555 0100',
    msgLabelBatch: 'Shared message (for anyone without their own)', makeBatch: n => `✦ Create ${n} cards`,
    batchTitle: (th, n, d) => `${th.emoji} ${n} cards · ${d} sent`, batchEmpty: 'The list is empty — add at least one name',
    copyAll: '📋 Copy all', csv: '⬇️ Export CSV', customTag: 'own message', noPhone: 'no phone', markSent: 'Mark as sent',
    allCopied: 'All messages copied ✦', csvHead: ['Name', 'Phone', 'Link', 'Message'],
    batchNote: '💬 opens WhatsApp: with a phone number it goes straight to that chat with the message filled in — just tap send. It’s marked as sent automatically.<br>WeChat / Instagram: 🔗 copies one link, or “Copy all” and paste them one by one.<br>Phone numbers need the country code (e.g. 852, 86, 1), or WhatsApp can’t find the person.',
    shareText: (th, to, url) => `${th.emoji} ${to ? to + ', ' : ''}I made you a little ${th.cardName.en} ✨ Open it here:\n${url}`
  }
};

const qTheme = new URLSearchParams(location.search).get('theme');
let theme = THEMES[qTheme] ? qTheme : (THEMES[store.get('cards.theme')] ? store.get('cards.theme') : 'christmas');
let lang = store.get('cards.lang', store.get('xmas.lang', 'zh'));
if (lang !== 'en') lang = 'zh';
let current = null;   // { to, url, theme, lang }

// links made with the old Christmas-only maker (xmas/create.html) carry over
if (!store.get('cards.sent', null) && store.get('xmas.sent', null)) {
  store.set('cards.sent', store.get('xmas.sent', []).map(x => ({ ...x, theme: 'christmas', lang: x.lang === 'en' ? 'en' : 'zh' })));
}
const toEl = $('#to'), msgEl = $('#msg'), fromEl = $('#from'), listEl = $('#list');
fromEl.value = store.get('cards.from', store.get('xmas.from', ''));

// theme buttons
const themeBox = $('#themes');
ORDER.forEach(id => {
  const th = THEMES[id];
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'theme'; b.dataset.theme = id;
  const em = document.createElement('span'); em.className = 'em'; em.textContent = th.emoji;
  const nm = document.createElement('span'); nm.className = 'nm';
  b.append(em, nm);
  b.addEventListener('click', () => { theme = id; store.set('cards.theme', id); apply(); });
  themeBox.appendChild(b);
});

function apply() {
  const t = UI[lang], th = THEMES[theme];
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t[el.dataset.i18n];
    if (typeof v === 'string') el.innerHTML = v;   // only static strings defined above
  });
  $('h1').textContent = t.h1(th);
  document.querySelectorAll('#langSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  document.querySelectorAll('.theme').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.theme === theme));
    b.querySelector('.nm').textContent = THEMES[b.dataset.theme].name[lang];
  });
  const acc = (th.vars && th.vars.accent) || '#f3c97a';
  document.documentElement.style.setProperty('--gold', acc);
  msgEl.placeholder = t.msgPh;
  // the field starts with this occasion's default message; text the user wrote is never replaced
  if (isStock(msgEl.value)) { msgEl.value = th.message[lang]; count(); }
  const chips = $('#chips');
  chips.textContent = '';
  const presets = th.presets[lang].some(([, text]) => text === th.message[lang])
    ? th.presets[lang] : [[t.defChip, th.message[lang]], ...th.presets[lang]];
  presets.forEach(([name, text]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.dataset.text = text;
    b.textContent = text === th.message[lang] ? t.defChip : name;
    b.addEventListener('click', () => { msgEl.value = text; count(); markChips(); refreshPreview(); msgEl.focus(); });
    chips.appendChild(b);
  });
  markChips();
  renderSent();
  $('#pvToggle').textContent = pvCollapsed ? t.pvShow : t.pvHide;
  listEl.placeholder = t.listPh;
  applyMode();
  renderBatch();
  refreshPreview();
}

/* ---------- live preview ---------- */
const pv = $('#pv'), phone = $('#phone');
let pvKey = '', pvTimer = 0, pvCollapsed = store.get('cards.pvCollapsed', false);
phone.classList.toggle('collapsed', pvCollapsed);
const fit = () => phone.style.setProperty('--k', phone.clientWidth / 360);
if ('ResizeObserver' in window) new ResizeObserver(fit).observe(phone); else addEventListener('resize', fit);
function refreshPreview() {
  const key = theme + '|' + lang;
  if (key !== pvKey) {                 // occasion or language changed: load that card
    pvKey = key;
    const u = new URL(`./${theme}/`, location.href);
    const p = cardParams(pvPerson());
    p.set('preview', '1');
    u.search = p.toString();
    pv.src = u.toString();
  } else {                             // only the words changed: update the text in place
    const who = pvPerson();
    try { pv.contentWindow.postMessage({ type: 'card-preview', to: who.to, from: fromEl.value, msg: who.msg }, location.origin); } catch (e) {}
  }
}
[toEl, msgEl, fromEl, listEl].forEach(el => el.addEventListener('input', () => { clearTimeout(pvTimer); pvTimer = setTimeout(refreshPreview, 250); }));
$('#pvToggle').addEventListener('click', () => {
  pvCollapsed = !pvCollapsed; store.set('cards.pvCollapsed', pvCollapsed);
  phone.classList.toggle('collapsed', pvCollapsed);
  $('#pvToggle').textContent = pvCollapsed ? UI[lang].pvShow : UI[lang].pvHide;
  fit();
});

function count() { $('#count').textContent = `${msgEl.value.length}/300`; }
msgEl.addEventListener('input', () => { count(); markChips(); });
function markChips() {
  document.querySelectorAll('#chips .chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.text === msgEl.value.trim())));
}
// default + preset texts of every occasion and language: switching occasion swaps these, keeps anything custom
const STOCK = new Set(Object.values(THEMES).flatMap(th => ['zh', 'en'].flatMap(l => [th.message[l], ...th.presets[l].map(p => p[1])])));
const isStock = v => !v.trim() || STOCK.has(v.trim());
/* Short links (read by engine.js):
   - the default message is left out (the card shows it anyway)
   - a preset message becomes its number: m=3 (presets are only ever appended, never reordered)
   - any other text uses the shorter of %-escaping and "." + base64url of its UTF-8 bytes
     (a Chinese character is 9 characters %-escaped, about 4 in base64url) */
function pack(v) {
  const plain = new URLSearchParams({ x: v }).toString().length - 2;
  const b64 = '.' + btoa(String.fromCharCode(...new TextEncoder().encode(v))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return v[0] === '.' || b64.length < plain ? b64 : v;
}
function cardParams(o = {}) {
  const th = THEMES[theme], p = new URLSearchParams();
  const to = (o.to != null ? o.to : toEl.value).trim(), from = fromEl.value.trim(), msg = (o.msg != null ? o.msg : msgEl.value).trim();
  if (to) p.set('t', pack(to));
  if (from) p.set('f', pack(from));
  if (msg && msg !== th.message[lang]) {
    const i = th.presets[lang].findIndex(x => x[1] === msg);
    if (i >= 0) p.set('m', String(i + 1)); else p.set('s', pack(msg));
  }
  p.set('l', lang);
  return p;
}
document.querySelectorAll('#langSeg button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang; store.set('cards.lang', lang); apply();
}));

function buildUrl() {
  const u = new URL(`./${theme}/`, location.href);
  u.search = cardParams().toString();
  return { to: toEl.value.trim(), url: u.toString(), theme, lang };
}

let toastTimer = 0;
function toast(text) {
  const el = $('#toast');
  el.textContent = text; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast(UI[lang].copied); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch {}
    ta.remove();
    toast(ok ? UI[lang].copied : UI[lang].copyFail);
  }
}
const waLink = c => 'https://wa.me/?text=' + encodeURIComponent(UI[c.lang].shareText(THEMES[c.theme], c.to, c.url));

function show(card) {
  current = card;
  $('#result').hidden = false;
  $('#link').textContent = card.url;
  $('#preview').href = card.url;
  $('#wa').href = waLink(card);
  const rec = new URL(card.url); rec.searchParams.set('rec', '1');
  $('#rec').href = rec.toString();
  $('#result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

$('#make').addEventListener('click', () => {
  store.set('cards.from', fromEl.value.trim());
  if (mode === 'batch') { makeBatch(); return; }
  const card = buildUrl();
  show(card);
  const list = store.get('cards.sent', []).filter(x => x.url !== card.url);
  list.unshift({ ...card, at: Date.now() });
  store.set('cards.sent', list.slice(0, 60));
  renderSent();
});
$('#copy').addEventListener('click', () => current && copy(current.url));
$('#share').addEventListener('click', async () => {
  if (!current) return;
  if (!navigator.share) { toast(UI[lang].noShare); return; }
  try { await navigator.share({ title: THEMES[current.theme].emoji, text: UI[current.lang].shareText(THEMES[current.theme], current.to, '').trim(), url: current.url }); } catch {}
});

function renderSent() {
  const list = store.get('cards.sent', []);
  const ul = $('#sent');
  ul.textContent = '';
  $('#empty').hidden = list.length > 0;
  $('#clear').hidden = list.length === 0;
  list.forEach(item => {
    if (!THEMES[item.theme]) return;
    const li = document.createElement('li');
    const who = document.createElement('span'); who.className = 'who';
    who.textContent = `${THEMES[item.theme].emoji} ${item.to || UI[lang].anyone}`;
    const tag = document.createElement('small'); tag.textContent = item.lang === 'en' ? 'EN' : '中文';
    who.appendChild(tag);
    const open = document.createElement('a'); open.className = 'btn'; open.href = item.url; open.target = '_blank'; open.rel = 'noopener'; open.textContent = '👀';
    const cp = document.createElement('button'); cp.type = 'button'; cp.className = 'btn'; cp.textContent = '🔗';
    cp.addEventListener('click', () => copy(item.url));
    const wa = document.createElement('a'); wa.className = 'btn wa'; wa.target = '_blank'; wa.rel = 'noopener'; wa.textContent = '💬';
    wa.href = waLink(item);
    li.append(who, open, cp, wa);
    ul.appendChild(li);
  });
}
$('#clear').addEventListener('click', () => { store.set('cards.sent', []); renderSent(); });

/* ---------- batch mode ---------- */
let mode = store.get('cards.mode', 'single') === 'batch' ? 'batch' : 'single';
listEl.value = store.get('cards.list', '');
// one person per line: "name | phone | own message" — also accepts "name, phone" / "name phone"
function parseList(text) {
  const rows = [];
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line) continue;
    let name = line, phone = '', msg = '';
    const parts = line.split(/\s*[|｜]\s*/);
    if (parts.length > 1) {
      name = parts[0];
      if (/^\+?[\d\s\-().]{6,}$/.test(parts[1])) { phone = parts[1]; msg = parts.slice(2).join(' | '); }
      else msg = parts.slice(1).join(' | ');
    } else {
      const m = line.match(/^(.*?)[\s,，、;；:：]+(\+?\d[\d\s\-().]{5,})$/);
      if (m) { name = m[1]; phone = m[2]; }
    }
    name = name.trim().slice(0, 24);
    if (!name) continue;
    rows.push({ name, phone: phone.replace(/\D/g, ''), msg: msg.trim().slice(0, 300) });
  }
  return rows.slice(0, 200);
}
function pvPerson() {                  // what the live preview shows
  if (mode !== 'batch') return { to: toEl.value, msg: msgEl.value };
  const r = parseList(listEl.value)[0];
  return { to: r ? r.name : '', msg: r && r.msg ? r.msg : msgEl.value };
}
function applyMode() {
  const t = UI[lang], batch = mode === 'batch';
  $('#toField').hidden = batch;
  $('#listField').hidden = !batch;
  document.querySelectorAll('#modeSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
  $('#msgLabel').textContent = batch ? t.msgLabelBatch : t.msgLabel;
  $('#result').hidden = batch || !current;
  $('#batch').hidden = !batch || !store.get('cards.batch', null);
  updateMakeLabel();
}
function updateMakeLabel() {
  const t = UI[lang], n = parseList(listEl.value).length;
  $('#make').textContent = mode === 'batch' ? t.makeBatch(n) : t.make;
  $('#listCount').textContent = t.listCount(n);
}
document.querySelectorAll('#modeSeg button').forEach(b => b.addEventListener('click', () => {
  mode = b.dataset.mode; store.set('cards.mode', mode); applyMode(); refreshPreview();
}));
listEl.addEventListener('input', () => { store.set('cards.list', listEl.value); updateMakeLabel(); });

function makeBatch() {
  const rows = parseList(listEl.value);
  if (!rows.length) { toast(UI[lang].batchEmpty); listEl.focus(); return; }
  const old = store.get('cards.batch', null);
  const sentBefore = new Set(old && old.items ? old.items.filter(i => i.sent).map(i => i.url) : []);
  const items = rows.map(r => {
    const u = new URL(`./${theme}/`, location.href);
    u.search = cardParams({ to: r.name, msg: r.msg || msgEl.value }).toString();
    const url = u.toString();
    return { to: r.name, phone: r.phone, custom: !!r.msg, url, sent: sentBefore.has(url) };
  });
  store.set('cards.batch', { theme, lang, items, at: Date.now() });
  renderBatch();
  $('#batch').hidden = false;
  $('#batch').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
const batchText = (b, i) => UI[b.lang].shareText(THEMES[b.theme], i.to, i.url);
function setSent(idx, v) {
  const b = store.get('cards.batch', null);
  if (!b || !b.items[idx]) return;
  b.items[idx].sent = v; store.set('cards.batch', b); renderBatch();
}
function renderBatch() {
  const b = store.get('cards.batch', null), ul = $('#batchList');
  ul.textContent = '';
  if (!b || !b.items || !THEMES[b.theme]) return;
  const t = UI[lang];
  $('#batchTitle').textContent = t.batchTitle(THEMES[b.theme], b.items.length, b.items.filter(i => i.sent).length);
  b.items.forEach((item, idx) => {
    const li = document.createElement('li');
    li.classList.toggle('is-done', !!item.sent);
    const mark = document.createElement('button');
    mark.type = 'button'; mark.className = 'done-btn'; mark.title = t.markSent; mark.setAttribute('aria-label', t.markSent);
    mark.setAttribute('aria-pressed', String(!!item.sent)); mark.textContent = item.sent ? '✓' : '';
    mark.addEventListener('click', () => setSent(idx, !item.sent));
    const who = document.createElement('span'); who.className = 'who';
    who.textContent = item.to || t.anyone;
    const tag = document.createElement('small');
    tag.textContent = [item.phone ? '+' + item.phone : t.noPhone, item.custom ? t.customTag : ''].filter(Boolean).join(' · ');
    who.appendChild(tag);
    const open = document.createElement('a'); open.className = 'btn'; open.href = item.url; open.target = '_blank'; open.rel = 'noopener'; open.textContent = '👀';
    const cp = document.createElement('button'); cp.type = 'button'; cp.className = 'btn'; cp.textContent = '🔗';
    cp.addEventListener('click', () => copy(item.url));
    const wa = document.createElement('a'); wa.className = 'btn wa'; wa.target = '_blank'; wa.rel = 'noopener'; wa.textContent = '💬';
    wa.href = `https://wa.me/${item.phone || ''}?text=` + encodeURIComponent(batchText(b, item));
    wa.addEventListener('click', () => setTimeout(() => setSent(idx, true), 300));
    li.append(mark, who, open, cp, wa);
    ul.appendChild(li);
  });
}
$('#batchClear').addEventListener('click', () => { store.set('cards.batch', null); renderBatch(); $('#batch').hidden = true; });
$('#copyAll').addEventListener('click', async () => {
  const b = store.get('cards.batch', null);
  if (!b) return;
  const text = b.items.map(i => `【${i.to}】\n${batchText(b, i)}`).join('\n\n');
  try { await navigator.clipboard.writeText(text); toast(UI[lang].allCopied); } catch { copy(text); }
});
$('#csv').addEventListener('click', () => {
  const b = store.get('cards.batch', null);
  if (!b) return;
  const cell = v => { let s = String(v); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };   // no spreadsheet formulas
  const rows = [UI[lang].csvHead, ...b.items.map(i => [i.to, i.phone ? '+' + i.phone : '', i.url, batchText(b, i)])];
  const csv = '\ufeff' + rows.map(r => r.map(cell).join(',')).join('\r\n');   // BOM so Excel reads Chinese
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `${b.theme}-cards.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});

apply();
count();
})();
</script>
</body>
</html>
